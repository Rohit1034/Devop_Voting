server {
    listen 80;
    
    # Root directory where the static files are stored
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle React Router navigation inside the container
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Aggressive caching for static assets
    location ~* \.(?:css|js|jpg|svg|gif|png|ico|json|map)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
